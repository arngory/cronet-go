name: Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built libraries to the go-158 branch, overwriting it'
        type: boolean
        default: false
  push:
    branches: [claude/clever-feynman-w0e2v1]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The Go code that needs no library: DatagramConn against a fake stream, the loader, the build tool. purego, since
  # the cgo build links the library; with the race detector.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.25
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Unit tests
        run: CGO_ENABLED=1 go test -race -count=1 -tags with_purego . ./internal/... ./cmd/...
      - name: Cross-build purego
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 linux/386 linux/arm darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -tags with_purego . ./internal/...
          done

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.26
      # chrome_root_store_generated.go is the list of the Chromium the libraries are built from
      - name: Check the generated root store list
        run: go run ./cmd/build-naive generate-root-store --check
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-${{ hashFiles('naiveproxy/src/get-clang.sh', 'naiveproxy/src/get-sysroot.sh', 'naiveproxy/src/get-openwrt.sh', 'naiveproxy/src/DEPS', 'naiveproxy/src/tools/clang/scripts/update.py', 'naiveproxy/src/build/linux/sysroot_scripts/sysroot_creator.py', 'naiveproxy/src/build/linux/sysroot_scripts/reversion_glibc.py', 'naiveproxy/src/build/linux/sysroot_scripts/generated_package_lists/**', 'cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}
      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-linux-${{ matrix.arch }}
      - name: Restore ccache files
        id: ccache-cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-
            ccache-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update || true
          sudo apt install -y ninja-build ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        id: build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} build
      - name: Show ccache stats
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        run: ccache -s
      # Saved right after the build, so that a failure in a later step does not cost a rebuild
      - name: Save ccache files
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}
      - name: Save build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package
        run: |
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} package --local
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} package
      - name: Download clang and sysroot
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} download-toolchain
      - name: Build test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env --export)
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -c -o ../cronet.test .
      - name: Run test binary
        run: ./cronet.test -test.v -test.run=TestEngineVersion
      # The cgo build of a library without datagram streams: include/ without datagram_stream_c.h, include_cgo.go
      # without the define that goes with it. It must build and link, and report no datagram support.
      - name: Build and run test binary without datagram streams
        run: |
          eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env --export)
          grep -q -- '-DCRONET_GO_HAS_DATAGRAM_STREAM=1' include_cgo.go
          mv include/datagram_stream_c.h datagram_stream_c.h.saved
          cp include_cgo.go include_cgo.go.saved
          sed -i 's/ -DCRONET_GO_HAS_DATAGRAM_STREAM=1//' include_cgo.go
          ! grep -q CRONET_GO_HAS_DATAGRAM_STREAM include_cgo.go
          status=0
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -c -o ../cronet.nodatagram.test . || status=$?
          mv datagram_stream_c.h.saved include/datagram_stream_c.h
          mv include_cgo.go.saved include_cgo.go
          [ "$status" -eq 0 ]
          CRONET_TEST_NO_DATAGRAM_SUPPORT=1 ./cronet.nodatagram.test -test.v -test.run='TestDatagramUnsupportedLibrary|TestEngineVersion'
      - name: Build purego test binary
        run: |
          cp lib/linux_${{ matrix.arch }}/libcronet.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -tags with_purego -c -o ../cronet.purego.test .
      - name: Run purego test binary
        run: |
          export LD_LIBRARY_PATH=$PWD
          ./cronet.purego.test -test.v -test.run=TestEngineVersion
      - name: Generate checksums
        run: |
          find lib include include_cgo.go lib_*_cgo.go -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | tee SHA256SUMS
          find lib include -type f -print0 | LC_ALL=C sort -z | xargs -0 stat -c '%s %n'
          {
            echo '### cronet-linux-${{ matrix.arch }} (Chromium ${{ steps.chromium.outputs.version }}, naiveproxy ${{ steps.naive.outputs.commit }})'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: cronet-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go
            SHA256SUMS
      - name: Show artifact digest
        run: echo "cronet-linux-${{ matrix.arch }} id=${{ steps.upload.outputs.artifact-id }} sha256=${{ steps.upload.outputs.artifact-digest }}"

  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      SCCACHE_ARM64_VERSION: 0.12.0
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.26
      - name: Get naiveproxy commit
        id: naive
        shell: bash
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        shell: bash
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-windows-${{ matrix.arch }}
      - name: Install tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: choco install ninja -y
      - name: Install sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            choco install sccache --version=${{ env.SCCACHE_ARM64_VERSION }} -y
          } else {
            choco install sccache -y
          }
      - name: Get sccache version
        if: steps.build-cache.outputs.cache-hit != 'true'
        id: sccache
        shell: pwsh
        run: |
          $rawVersion = sccache --version
          if ($LASTEXITCODE -ne 0) {
            throw "failed to get sccache version"
          }
          $version = ($rawVersion | Select-Object -First 1) -replace '^sccache\s+', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "invalid sccache version output: $rawVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore sccache files
        id: sccache-cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-windows-${{ matrix.arch }}-${{ steps.sccache.outputs.version }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-windows-${{ matrix.arch }}-${{ steps.sccache.outputs.version }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-
            sccache-windows-${{ matrix.arch }}-${{ steps.sccache.outputs.version }}-${{ steps.chromium.outputs.version }}-
      - name: Reset sccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sccache -z
      - name: Build
        id: build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=windows/${{ matrix.arch }} build
      - name: Show sccache stats
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        run: sccache -s
      # Saved right after the build, so that a failure in a later step does not cost a rebuild
      - name: Save sccache files
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: ${{ steps.sccache-cache.outputs.cache-primary-key }}
      - name: Save build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package
        run: go run ./cmd/build-naive --target=windows/${{ matrix.arch }} package
      - name: Build and run test binary
        if: matrix.arch != 'arm64'
        shell: bash
        run: |
          # The DLL beside the test binary, which purego loads from there
          cp lib/windows_${{ matrix.arch }}/libcronet.dll .
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.arch }} go -C test test -tags with_purego -c -o ../cronet.test.exe .
          ./cronet.test.exe -test.v -test.run='TestEngineVersion|TestPublicSiteChainEndsAtTrustedIntermediate|TestDatagram'
        env:
          CRONET_TEST_PUBLIC_SITES: "1"
      - name: Generate checksums
        shell: bash
        run: |
          find lib include include_cgo.go -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | tee SHA256SUMS
          {
            echo '### cronet-windows-${{ matrix.arch }} (Chromium ${{ steps.chromium.outputs.version }}, naiveproxy ${{ steps.naive.outputs.commit }})'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: cronet-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            lib/
            include/
            include_cgo.go
            SHA256SUMS

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cc: aarch64-linux-android23-clang
          - arch: amd64
            cc: x86_64-linux-android23-clang
          - arch: arm
            cc: armv7a-linux-androideabi23-clang
          - arch: "386"
            cc: i686-linux-android23-clang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.26
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-android-${{ matrix.arch }}
      - name: Restore ccache files
        id: ccache-cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-android-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-
            ccache-android-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update || true
          sudo apt install -y ninja-build ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        id: build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=android/${{ matrix.arch }} build
      - name: Show ccache stats
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        run: ccache -s
      # Saved right after the build, so that a failure in a later step does not cost a rebuild
      - name: Save ccache files
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}
      - name: Save build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: naiveproxy/src/out
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package
        run: |
          go run ./cmd/build-naive --target=android/${{ matrix.arch }} package --local
          go run ./cmd/build-naive --target=android/${{ matrix.arch }} package
      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28
      - name: Build test binary
        run: |
          CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }} \
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.arch }} go -C test test -c -o ../cronet.test .
      - name: Generate checksums
        run: |
          find lib include include_cgo.go lib_*_cgo.go -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | tee SHA256SUMS
          find lib include -type f -print0 | LC_ALL=C sort -z | xargs -0 stat -c '%s %n'
          {
            echo '### cronet-android-${{ matrix.arch }} (Chromium ${{ steps.chromium.outputs.version }}, naiveproxy ${{ steps.naive.outputs.commit }})'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: cronet-android-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go
            SHA256SUMS
      - name: Show artifact digest
        run: echo "cronet-android-${{ matrix.arch }} id=${{ steps.upload.outputs.artifact-id }} sha256=${{ steps.upload.outputs.artifact-digest }}"

  integration-test:
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-cgo
            os: ubuntu-22.04
            artifact: cronet-linux-amd64
            target: linux/amd64
            mode: cgo
          - name: linux-amd64-purego
            os: ubuntu-22.04
            artifact: cronet-linux-amd64
            target: linux/amd64
            mode: purego
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CRONET_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/${{ matrix.name }}
      CRONET_TEST_CAPTURE_NETLOG: "1"
      # the tests that reach public sites (test/public_site_pins_test.go)
      CRONET_TEST_PUBLIC_SITES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.26

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: .

      - name: Verify checksums
        run: |
          sha256sum -c --quiet SHA256SUMS
          echo "SHA256SUMS: $(wc -l < SHA256SUMS) files verified"

      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT

      # Restore toolchain cache (needed for env command)
      - name: Restore toolchain cache
        if: matrix.mode == 'cgo'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-amd64-${{ steps.chromium.outputs.version }}-${{ steps.naive.outputs.commit }}-${{ hashFiles('naiveproxy/src/get-clang.sh', 'naiveproxy/src/get-sysroot.sh', 'naiveproxy/src/get-openwrt.sh', 'naiveproxy/src/DEPS', 'naiveproxy/src/tools/clang/scripts/update.py', 'naiveproxy/src/build/linux/sysroot_scripts/sysroot_creator.py', 'naiveproxy/src/build/linux/sysroot_scripts/reversion_glibc.py', 'naiveproxy/src/build/linux/sysroot_scripts/generated_package_lists/**', 'cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}

      - name: Download toolchain
        if: matrix.mode == 'cgo'
        run: go run ./cmd/build-naive --target=${{ matrix.target }} download-toolchain

      - name: Install iperf3
        run: |
          sudo apt update || true
          sudo apt install -y iperf3

      # CGO mode tests
      - name: Run integration tests (CGO)
        if: matrix.mode == 'cgo'
        timeout-minutes: 20
        run: |
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          eval $(go run ./cmd/build-naive --target=${{ matrix.target }} env --export)
          cd test
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          status=0
          CGO_ENABLED=1 go test -v -timeout=12m >"$LOG_PATH" 2>&1 || status=$?
          grep -E '^\s*--- (PASS|FAIL|SKIP)|^(PASS|FAIL|ok)\s*|chrome-root-store:' "$LOG_PATH" || true
          if [ "$status" -ne 0 ]; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      # purego mode tests
      - name: Run integration tests (purego)
        if: matrix.mode == 'purego'
        timeout-minutes: 20
        working-directory: test
        run: |
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          export LD_LIBRARY_PATH=$PWD/../lib/linux_amd64
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          status=0
          CGO_ENABLED=0 go test -tags with_purego -v -timeout=12m >"$LOG_PATH" 2>&1 || status=$?
          grep -E '^\s*--- (PASS|FAIL|SKIP)|^(PASS|FAIL|ok)\s*|chrome-root-store:' "$LOG_PATH" || true
          if [ "$status" -ne 0 ]; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      - name: Upload integration logs (test failure)
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-logs-${{ matrix.name }}
          path: test-artifacts/${{ matrix.name }}/
          if-no-files-found: warn

  # Runs only when asked for by a manual dispatch of this branch. The target
  # branch is fixed: the push is forced and replaces what was published before.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/claude/clever-feynman-w0e2v1'
    needs: [unit, linux, android, windows, integration-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ^1.22

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cronet-*
          path: artifacts/

      - name: Merge artifacts
        run: |
          for target in android-arm64 android-arm android-amd64 android-386 linux-amd64 windows-amd64 windows-arm64; do
            dir="artifacts/cronet-$target"
            (cd "$dir" && sha256sum -c --quiet SHA256SUMS)
            cp -r "$dir/lib" "$dir/include" "$dir/include_cgo.go" .
          done
          find lib include include_cgo.go -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | tee SHA256SUMS
          find lib include -type f -print0 | LC_ALL=C sort -z | xargs -0 stat -c '%s %n'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: go run ./cmd/build-naive publish --branch go-158 --skip-all-package

      - name: Show published commit
        run: |
          git fetch --depth=1 origin refs/heads/go-158
          commit=$(git rev-parse FETCH_HEAD)
          version=$(TZ=UTC git show -s --date=format-local:%Y%m%d%H%M%S --format="v0.0.0-%cd-$(echo "$commit" | cut -c1-12)" FETCH_HEAD)
          echo "go-158 $commit $version"
          {
            echo "### Published to go-158"
            echo "commit $commit, pseudo-version $version"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
